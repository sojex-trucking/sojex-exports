name: SOJEX Exports CI

on:
  push:
    branches:
      - 'codex/build-sojex-exports-website-using-next.js'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://sojexexports.com
